# ─────────────────────────────────────────────────────────────
# POS System — CI Pipeline
# Triggers: push/PR to master, manual dispatch
# Steps: build → test (Release) with Coverlet coverage → badge
# ─────────────────────────────────────────────────────────────

name: POS CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Setup .NET ────────────────────────────────────────
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── Restore ───────────────────────────────────────────
      - name: Restore NuGet packages
        run: dotnet restore POS.sln

      # ── Build + Test with Coverlet Coverage ──────────────
      # NOTE: Coverlet MSBuild instrumentation requires the
      # build to run WITH the /p:CollectCoverage=true property.
      # Using --no-build would skip instrumentation.
      - name: Run tests with Coverlet coverage
        run: |
          dotnet test POS.sln --configuration Release `
            /p:CollectCoverage=true `
            /p:CoverletOutputFormat=opencover `
            /p:CoverletOutput=../coverage.xml `
            --logger "console;verbosity=normal"

      # ── Upload Coverage to Codecov ────────────────────────
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: false

      # ── Upload Test Results (always, for debugging) ──────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

      # ── Publish application (on push to master only) ─────
      - name: Publish application
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          dotnet publish POS.Desktop/POS.Desktop.csproj `
            --configuration Release `
            --output publish/ `
            --self-contained false

      - name: Upload build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: pos-desktop-release
          path: publish/
          retention-days: 30
